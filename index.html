<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Estimator</title>

    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

    <div class="container">

        <h1>Weather Estimator</h1>

        <!-- Search Section -->
        <div class="search-box">
            <input type="text" placeholder="Enter city name" id="city-input">

            <button id="search-btn">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>

        <button id="location-btn">
    <i class="fa-solid fa-location-dot"></i>
    Use My Location
</button>

        <!-- Weather Information -->
        <div class="weather-info">

            <div class="weather-icon">
                ☀️
            </div>

            <h2 class="temperature">30°C</h2>

            <h3 class="city">Mumbai</h3>
            <p class="date-time"></p>

            <p class="description">Clear Sky</p>

            <!-- Extra Details -->
            <div class="details">

                <div class="detail-box">
                    <i class="fa-solid fa-droplet"></i>
                    <div>
                        <p>Humidity</p>
                        <span class="humidity">60%</span>
                    </div>
                </div>

                <div class="detail-box">
                    <i class="fa-solid fa-wind"></i>
                    <div>
                        <p>Wind</p>
                        <span class="wind">15 km/h</span>
                    </div>
                </div>

            </div>

        </div>

    </div>

    <script src="config.js"></script>
    <script src="script.js"></script>

</body>
</html>
